# Builds the SwiftScan iPhone app in the cloud (EAS Build) and uploads it to App Store Connect.
# Run it from GitHub: Actions → "iPhone release" → Run workflow.
#
# One-time setup (see mobile/README.md → "Releasing"):
#   - Secret   EXPO_TOKEN  : an Expo access token (expo.dev → Account settings → Access tokens)
#   - Variable ASC_APP_ID  : the app's Apple ID number from App Store Connect (App Information)
#   - The first iOS build must have been run once interactively (mobile/scripts/first-release.sh)
#     so Expo holds your signing certificate and App Store Connect API key.
name: iPhone release

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload to App Store Connect (TestFlight) after building"
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check setup
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret (Settings → Secrets and variables → Actions). See mobile/README.md."
            exit 1
          fi
          if [ "$SUBMIT" = "true" ] && [ -z "$ASC_APP_ID" ]; then
            echo "::error::Add the ASC_APP_ID variable (Settings → Secrets and variables → Actions → Variables). See mobile/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link the Expo project
        run: eas init --non-interactive --force

      - name: Set App Store Connect app ID
        if: ${{ inputs.submit }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            cfg.submit.production = { ...(cfg.submit.production || {}), ios: { ...((cfg.submit.production || {}).ios || {}), ascAppId: process.env.ASC_APP_ID } };
            fs.writeFileSync("eas.json", JSON.stringify(cfg, null, 2));
          '

      - name: Check the app
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Build (and submit) on EAS
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile production --non-interactive --auto-submit --wait
          else
            eas build --platform ios --profile production --non-interactive --wait
          fi
