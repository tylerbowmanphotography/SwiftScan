<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SwiftScan: Snap it. Know what it's worth.</title>
    <meta name="description" content="Scan a barcode or product with your phone and get an AI price estimate, a deal rating and retailer links before you buy." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ss_theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WF50NC68BJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WF50NC68BJ');
    </script>
    <!-- Google AdSense is loaded from src/utils/adsense.ts only when VITE_ADSENSE_CLIENT is set. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
